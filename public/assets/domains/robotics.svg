<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="roboGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="opticGlow" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="360" fill="url(#roboGrad)"/>
  <circle cx="300" cy="150" r="130" fill="url(#opticGlow)"/>
  <!-- Industrial Robotic Base -->
  <rect x="230" y="280" width="140" height="40" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="300" cy="280" r="28" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
  <!-- Arm Link 1 -->
  <line x1="300" y1="280" x2="250" y2="180" stroke="#0284c7" stroke-width="14" stroke-linecap="round"/>
  <circle cx="250" cy="180" r="16" fill="#38bdf8"/>
  <!-- Arm Link 2 -->
  <line x1="250" y1="180" x2="340" y2="120" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round"/>
  <circle cx="340" cy="120" r="14" fill="#67e8f9"/>
  <!-- Gripper / End Effector -->
  <path d="M340,120 L380,90" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <path d="M380,80 L395,75 M380,100 L395,105" stroke="#a5f3fc" stroke-width="5" stroke-linecap="round"/>
  <!-- Spark of Precision -->
  <polygon points="405,90 412,93 420,90 415,97 418,105 410,100 403,104 406,96" fill="#facc15"/>
  <circle cx="410" cy="95" r="12" fill="#fef08a" opacity="0.3"/>
</svg>
